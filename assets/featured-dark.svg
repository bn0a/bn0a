<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t d"><title id="t">megavault</title><desc id="d">Turns a research question into evidence-graded Markdown notes; each claim's status is computed by a script from quotes checked against pages cached during the run. One coordinator skill, four bounded subagents, a deterministic Python engine. 727 source records (across 24 research runs); 18.2% of claims unsupported (no accepted quote behind them); 469 Markdown notes written (an Obsidian-style vault); 169 offline tests (74 scenario + 95 unittest). Measured over 24 of the author's own research runs, which are not published; a claim's status is not an accuracy rate.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}.lede{fill:#a9b4cc;font-size:15px}.num{font-size:40px;font-weight:700;letter-spacing:-0.5px}.lbl{fill:#dbe3f3;font-size:15.5px}.sub{fill:#7d8aa6;font-size:15px}</style><rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="15.5" fill="#0b1020" stroke="#2a3754" stroke-width="1.5"/><path fill="#7d8aa6" transform="translate(40 31) scale(1.25)" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/><text x="70" y="50" class="mono" font-size="22" font-weight="600" fill="#f0f4fc">megavault</text><text x="1160" y="50" class="mono" font-size="14" fill="#2dd4bf" text-anchor="end">see the plugin →</text><text x="40" y="86" class="sans lede">Turns a research question into evidence-graded Markdown notes; each claim's status is computed by a script from quotes</text><text x="40" y="110" class="sans lede">checked against pages cached during the run. One coordinator skill, four bounded subagents, a deterministic Python engine.</text><line x1="40" y1="134" x2="1160" y2="134" stroke="#2a3754"/><text x="40" y="196" class="sans num" fill="#2dd4bf">727</text><text x="40" y="228" class="sans lbl">source records</text><text x="40" y="250" class="sans sub">across 24 research runs</text><line x1="315" y1="158" x2="315" y2="258" stroke="#2a3754"/><text x="340" y="196" class="sans num" fill="#f5b041">18.2%</text><text x="340" y="228" class="sans lbl">of claims unsupported</text><text x="340" y="250" class="sans sub">no accepted quote behind them</text><line x1="615" y1="158" x2="615" y2="258" stroke="#2a3754"/><text x="640" y="196" class="sans num" fill="#2dd4bf">469</text><text x="640" y="228" class="sans lbl">Markdown notes written</text><text x="640" y="250" class="sans sub">an Obsidian-style vault</text><line x1="900" y1="158" x2="900" y2="258" stroke="#2a3754"/><text x="925" y="196" class="sans num" fill="#2dd4bf">169</text><text x="925" y="228" class="sans lbl">offline tests</text><text x="925" y="250" class="sans sub">74 scenario + 95 unittest</text></svg>
